# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  jobs:
    # setuptools-scm needs the full history and tags to derive the version
    post_checkout:
      - git fetch --unshallow --tags || true
    # Install the package and the "docs" dependency group from uv.lock
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-default-groups --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
