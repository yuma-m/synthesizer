name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0
    - name: Determine next version
      id: version
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
        IFS=. read -r major minor patch <<< "${latest#v}"
        case "$BUMP" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
        esac
        tag="v$major.$minor.$patch"
        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
          echo "Tag $tag already exists" >&2
          exit 1
        fi
        echo "Releasing $tag (previous: $latest)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    # The version is derived from the tag by setuptools-scm,
    # so no commit to main is needed.
    - name: Create tag and GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
        SHA: ${{ steps.version.outputs.sha }}
      run: gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes

  # Tags created with GITHUB_TOKEN do not trigger other workflows,
  # so call the deploy workflow explicitly.
  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
