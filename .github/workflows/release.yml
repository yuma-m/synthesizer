name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
        fetch-depth: 0
    - name: Determine next version
      id: version
      env:
        BUMP: ${{ inputs.bump }}
      run: |
        latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
        IFS=. read -r major minor patch <<< "${latest#v}"
        case "$BUMP" in
          major) major=$((major + 1)); minor=0; patch=0 ;;
          minor) minor=$((minor + 1)); patch=0 ;;
          patch) patch=$((patch + 1)) ;;
        esac
        tag="v$major.$minor.$patch"
        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
          echo "Tag $tag already exists" >&2
          exit 1
        fi
        echo "Releasing $tag (previous: $latest)"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    # The version is derived from the tag by setuptools-scm,
    # so no commit to main is needed.
    - name: Create tag and GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
        SHA: ${{ steps.version.outputs.sha }}
      run: gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes

  build:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.release.outputs.tag }}
        # setuptools-scm derives the version from the tag
        fetch-depth: 0
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Build sdist and wheel
      run: uv build
    - name: Check distributions
      run: uvx twine check --strict dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  # Publishes with PyPI Trusted Publishing (OIDC), so no API token is needed.
  # The trusted publisher on PyPI must point at this workflow (release.yml)
  # and the "pypi" environment.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/synthesizer/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
