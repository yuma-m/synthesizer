[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "synthesizer"
version = "0.2.0"
description = "A simple virtual analog synthesizer."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuma Mihira", email = "info@yurax2.com" }]
keywords = ["analog", "synthesizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
audio = ["PyAudio>=0.2.14"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/yuma-m/synthesizer"
Documentation = "https://synthesizer.readthedocs.io"
Changelog = "https://github.com/yuma-m/synthesizer/releases"

[tool.setuptools.packages.find]
include = ["synthesizer*"]

[tool.pytest.ini_options]
testpaths = ["test"]
