[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "synthesizer"
dynamic = ["version"]
description = "A simple virtual analog synthesizer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuma Mihira", email = "info@yuma.cloud" }]
keywords = ["analog", "synthesizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23.2",
    "scipy>=1.9.3",
]

[project.optional-dependencies]
audio = ["PyAudio>=0.2.14"]

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=6"]
lint = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
    "scipy-stubs>=1.17.1.5",
]
docs = [
    # Sphinx 9 requires Python 3.12+; fall back to Sphinx 8.2 on Python 3.11
    "sphinx>=8.2; python_version < '3.12'",
    "sphinx>=9.1.0; python_version >= '3.12'",
    "sphinx-rtd-theme>=3.1.0",
]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[project.urls]
Homepage = "https://github.com/yuma-m/synthesizer"
Documentation = "https://synthesizer.readthedocs.io"
Changelog = "https://github.com/yuma-m/synthesizer/releases"
Source = "https://github.com/yuma-m/synthesizer"
Issues = "https://github.com/yuma-m/synthesizer/issues"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["synthesizer*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY"]

[tool.mypy]
files = ["synthesizer"]
strict = true

[[tool.mypy.overrides]]
module = ["pyaudio"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
source = ["synthesizer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
